name: Android Code Verifier

# 1. Trigger the workflow on pushes or pull requests to your main branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  verify-and-build:
    # 2. Use a fresh Linux virtual machine hosted by GitHub
    runs-on: ubuntu-latest

    steps:
      # Step 3: Pull down your source code into the virtual machine
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 4: Set up the Java environment required by Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up future runs

      # Step 5: Fix permissions to allow GitHub to run the Gradle wrapper
      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Compile Debug APK
        run: ./gradlew assembleDebug

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk